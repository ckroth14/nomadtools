<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Signups — Nomad Tools Admin</title>
<link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="stylesheet" href="style.css">
<style>
  body { background: var(--bg-light); }

  .admin-wrap { max-width: 1000px; margin: 0 auto; padding: 3rem 1.5rem 5rem; }

  .admin-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 1rem;
    margin-bottom: 1.5rem;
  }

  .admin-head h1 {
    font-size: 1.4rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    color: var(--text-dark);
  }

  /* LOGIN */
  .login-card {
    max-width: 360px;
    margin: 6rem auto 0;
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 2rem;
    text-align: center;
  }

  .login-card h1 {
    font-size: 1.15rem;
    font-weight: 600;
    color: var(--text-dark);
    margin-bottom: 0.4rem;
  }

  .login-card p { font-size: 0.85rem; color: var(--text-mid); margin-bottom: 1.25rem; }

  .login-card input {
    width: 100%;
    margin-bottom: 0.75rem;
    text-align: center;
  }

  .login-card .btn { width: 100%; text-align: center; }

  .login-error {
    color: var(--red);
    font-size: 0.8rem;
    margin-top: 0.75rem;
    min-height: 1rem;
  }

  /* STATS */
  .stat-row { display: flex; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }

  .stat {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    padding: 1rem 1.5rem;
    min-width: 120px;
  }

  .stat .num { font-size: 1.6rem; font-weight: 600; color: var(--text-dark); letter-spacing: -0.02em; }
  .stat .lbl { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.08em; color: var(--text-mid); margin-top: 0.2rem; }
  .stat.red .num { color: var(--red); }

  /* TABLE */
  .table-card {
    background: #fff;
    border: 1px solid #ddd;
    border-radius: 6px;
    overflow: hidden;
  }

  .table-scroll { overflow-x: auto; }

  table { width: 100%; border-collapse: collapse; font-size: 0.85rem; }

  th, td { padding: 0.7rem 1rem; text-align: left; white-space: nowrap; }

  th {
    background: #fafafa;
    border-bottom: 1px solid #e0e0e0;
    font-size: 0.68rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-mid);
    font-weight: 600;
  }

  td { border-bottom: 1px solid #f0f0f0; color: var(--text-dark); }
  tr:last-child td { border-bottom: none; }
  tr:hover td { background: #fcfcfc; }

  .pill {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 500;
    padding: 0.15rem 0.55rem;
    border-radius: 20px;
    letter-spacing: 0.02em;
  }
  .pill.waitlist { background: rgba(227,30,36,0.1); color: var(--red); }
  .pill.membership { background: #eee; color: var(--text-mid); }

  .toolbar { display: flex; gap: 0.5rem; }

  .btn-sm { padding: 0.45rem 0.9rem; font-size: 0.8rem; }

  .empty { padding: 3rem 1rem; text-align: center; color: var(--text-mid); font-size: 0.9rem; }

  .muted { color: #999; font-style: italic; }

  /* EXPANDABLE ROWS */
  tr.has-details { cursor: pointer; }
  tr.has-details:hover td { background: #fbf4f4; }

  .caret {
    display: inline-block;
    width: 0.9rem;
    color: var(--red);
    transition: transform 0.15s;
    font-size: 0.75rem;
  }
  tr.open .caret { transform: rotate(90deg); }

  td.caret-cell { width: 1.4rem; padding-right: 0; text-align: center; }

  .detail-row td {
    background: #fafafa;
    border-bottom: 1px solid #f0f0f0;
    padding: 0;
  }

  .detail-panel {
    padding: 1rem 1.5rem 1.25rem 2.9rem;
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 0.9rem 1.5rem;
  }

  .detail-item .k {
    font-size: 0.66rem;
    text-transform: uppercase;
    letter-spacing: 0.06em;
    color: var(--text-mid);
    margin-bottom: 0.15rem;
  }
  .detail-item .v { font-size: 0.88rem; color: var(--text-dark); white-space: normal; word-break: break-word; }
  .detail-item.wide { grid-column: 1 / -1; }

  .no-detail { padding: 0.9rem 1.5rem 0.9rem 2.9rem; font-size: 0.8rem; color: #999; font-style: italic; }

  /* DELETE BUTTON */
  td.act-cell { text-align: right; width: 1px; white-space: nowrap; }
  .del-btn {
    width: 26px; height: 26px;
    border: 1px solid #e2e2e2;
    background: #fff;
    color: #bbb;
    border-radius: 5px;
    font-size: 0.8rem;
    line-height: 1;
    cursor: pointer;
    transition: all 0.12s;
  }
  .del-btn:hover { border-color: var(--red); color: var(--red); background: #fff5f5; }
  .del-btn:disabled { opacity: 0.5; cursor: default; }
</style>
</head>
<body>

<!-- LOGIN VIEW -->
<div id="loginView">
  <div class="login-card">
    <h1>Nomad Tools Admin</h1>
    <p>Enter the admin password to view signups.</p>
    <form id="loginForm">
      <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus />
      <button type="submit" class="btn btn-red">View signups</button>
    </form>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<!-- DATA VIEW -->
<div id="dataView" style="display:none;">
  <div class="admin-wrap">
    <div class="admin-head">
      <h1>Signups</h1>
      <div class="toolbar">
        <button class="btn btn-outline btn-sm" id="refreshBtn">Refresh</button>
        <button class="btn btn-red btn-sm" id="csvBtn">Export CSV</button>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat"><div class="num" id="statTotal">—</div><div class="lbl">Total</div></div>
      <div class="stat red"><div class="num" id="statWaitlist">—</div><div class="lbl">Waitlist</div></div>
      <div class="stat"><div class="num" id="statMembership">—</div><div class="lbl">Membership</div></div>
    </div>

    <div class="table-card">
      <div class="table-scroll">
        <table>
          <thead>
            <tr>
              <th></th><th>#</th><th>Email</th><th>List</th><th>Source</th><th>Country</th><th>Date (UTC)</th><th></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
      </div>
      <div class="empty" id="emptyMsg" style="display:none;">No signups yet.</div>
    </div>
  </div>
</div>

<script>
  const loginView = document.getElementById('loginView');
  const dataView = document.getElementById('dataView');
  const loginForm = document.getElementById('loginForm');
  const pwInput = document.getElementById('pw');
  const loginError = document.getElementById('loginError');

  let currentRows = [];

  // Keep the password only in memory for this tab session so a refresh
  // re-fetches without re-prompting, but it's gone when the tab closes.
  let sessionPw = sessionStorage.getItem('ntadmin') || '';

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, c => (
      { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]
    ));
  }

  async function fetchSignups(password) {
    const res = await fetch('/api/signups', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok || !data.ok) {
      const err = new Error(data.error || 'Request failed.');
      err.status = res.status;
      throw err;
    }
    return data.rows;
  }

  function render(rows) {
    currentRows = rows;
    document.getElementById('statTotal').textContent = rows.length;
    document.getElementById('statWaitlist').textContent = rows.filter(r => r.list === 'waitlist').length;
    document.getElementById('statMembership').textContent = rows.filter(r => r.list === 'membership').length;

    const tbody = document.getElementById('rows');
    const emptyMsg = document.getElementById('emptyMsg');
    if (!rows.length) {
      tbody.innerHTML = '';
      emptyMsg.style.display = 'block';
      return;
    }
    emptyMsg.style.display = 'none';
    tbody.innerHTML = rows.map(r => {
      const parsed = parseDetails(r.details);
      const expandable = r.list === 'waitlist';
      const cls = expandable ? 'has-details' : '';
      const caret = expandable ? '<span class="caret">▸</span>' : '';
      return `
      <tr class="${cls}" data-id="${esc(r.id)}">
        <td class="caret-cell">${caret}</td>
        <td class="muted">${esc(r.id)}</td>
        <td>${esc(r.email)}</td>
        <td><span class="pill ${esc(r.list)}">${esc(r.list)}</span></td>
        <td>${r.source ? esc(r.source) : '<span class="muted">—</span>'}</td>
        <td>${r.ip_country ? esc(r.ip_country) : '<span class="muted">—</span>'}</td>
        <td>${esc(r.created_at)}</td>
        <td class="act-cell"><button type="button" class="del-btn" data-id="${esc(r.id)}" data-email="${esc(r.email)}" title="Delete this signup" aria-label="Delete signup">✕</button></td>
      </tr>
      ${expandable ? `<tr class="detail-row" data-detail="${esc(r.id)}" style="display:none;">
        <td colspan="8">${renderDetailPanel(parsed)}</td>
      </tr>` : ''}`;
    }).join('');
  }

  // Friendly labels for the known waitlist fields; unknown keys fall back
  // to a title-cased version of the key.
  const FIELD_LABELS = {
    full_name: 'Full name',
    company: 'Company / Crew',
    phone: 'Phone',
    battery: 'Battery platform',
    use_case: 'Primary use case',
    quantity: 'Quantity',
    notes: 'Notes',
  };
  const FIELD_ORDER = ['full_name', 'company', 'phone', 'battery', 'use_case', 'quantity', 'notes'];

  function parseDetails(raw) {
    if (!raw) return null;
    try { const o = JSON.parse(raw); return (o && typeof o === 'object') ? o : null; }
    catch (e) { return null; }
  }

  function labelFor(key) {
    return FIELD_LABELS[key] || key.replace(/_/g, ' ').replace(/\b\w/g, c => c.toUpperCase());
  }

  function renderDetailPanel(d) {
    if (!d || !Object.keys(d).length) {
      return '<div class="no-detail">No extra form data captured for this signup.</div>';
    }
    const keys = FIELD_ORDER.filter(k => d[k]).concat(
      Object.keys(d).filter(k => !FIELD_ORDER.includes(k))
    );
    const items = keys.map(k => {
      const wide = k === 'notes' ? ' wide' : '';
      return `<div class="detail-item${wide}"><div class="k">${esc(labelFor(k))}</div><div class="v">${esc(d[k])}</div></div>`;
    }).join('');
    return `<div class="detail-panel">${items}</div>`;
  }

  function showData() {
    loginView.style.display = 'none';
    dataView.style.display = 'block';
  }

  async function load(password) {
    const rows = await fetchSignups(password);
    sessionPw = password;
    sessionStorage.setItem('ntadmin', password);
    render(rows);
    showData();
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.textContent = '';
    const btn = loginForm.querySelector('button');
    btn.disabled = true; btn.textContent = 'Checking…';
    try {
      await load(pwInput.value);
    } catch (err) {
      loginError.textContent = err.status === 401 ? 'Wrong password.' : (err.message || 'Something went wrong.');
      pwInput.select();
    } finally {
      btn.disabled = false; btn.textContent = 'View signups';
    }
  });

  // Expand/collapse a waitlist row to reveal its full form details.
  document.getElementById('rows').addEventListener('click', (e) => {
    if (e.target.closest('.del-btn')) return; // handled separately
    const tr = e.target.closest('tr.has-details');
    if (!tr) return;
    const id = tr.getAttribute('data-id');
    const detail = document.querySelector('.detail-row[data-detail="' + id + '"]');
    if (!detail) return;
    const open = detail.style.display !== 'none';
    detail.style.display = open ? 'none' : 'table-row';
    tr.classList.toggle('open', !open);
  });

  // Delete a signup (with confirmation), then refresh the table.
  document.getElementById('rows').addEventListener('click', async (e) => {
    const btn = e.target.closest('.del-btn');
    if (!btn) return;
    const id = btn.getAttribute('data-id');
    const email = btn.getAttribute('data-email') || 'this signup';
    if (!confirm('Delete ' + email + '? This cannot be undone.')) return;
    btn.disabled = true;
    try {
      const res = await fetch('/api/signups', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ password: sessionPw, action: 'delete', id: Number(id) }),
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok || !data.ok) {
        if (res.status === 401) { sessionStorage.removeItem('ntadmin'); location.reload(); return; }
        throw new Error(data.error || 'Delete failed.');
      }
      render(await fetchSignups(sessionPw));
    } catch (err) {
      alert(err.message || 'Delete failed.');
      btn.disabled = false;
    }
  });

  document.getElementById('refreshBtn').addEventListener('click', async () => {
    const btn = document.getElementById('refreshBtn');
    btn.disabled = true; btn.textContent = 'Refreshing…';
    try { render(await fetchSignups(sessionPw)); }
    catch (err) {
      if (err.status === 401) { sessionStorage.removeItem('ntadmin'); location.reload(); }
    }
    finally { btn.disabled = false; btn.textContent = 'Refresh'; }
  });

  document.getElementById('csvBtn').addEventListener('click', () => {
    const baseCols = ['id', 'email', 'list', 'source', 'ip_country', 'created_at'];
    const detailCols = FIELD_ORDER; // full_name, company, phone, battery, use_case, quantity, notes
    const cols = baseCols.concat(detailCols);
    const escCsv = v => {
      const s = v == null ? '' : String(v);
      return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    };
    const lines = [cols.join(',')].concat(
      currentRows.map(r => {
        const d = parseDetails(r.details) || {};
        return cols.map(c => escCsv(baseCols.includes(c) ? r[c] : d[c])).join(',');
      })
    );
    const blob = new Blob([lines.join('\n')], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'nomadtools-signups-' + new Date().toISOString().slice(0, 10) + '.csv';
    a.click();
    URL.revokeObjectURL(a.href);
  });

  // Auto-load if we already have a password from this tab session.
  if (sessionPw) {
    load(sessionPw).catch(() => { sessionStorage.removeItem('ntadmin'); });
  }
</script>

</body>
</html>
